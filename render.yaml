services:
  - type: web
    name: unihub
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input --clear"
    startCommand: "chmod +x start.sh && ./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
